name: Deploy and Release OBS Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Version Tag (e.g., v1.0.0)'
        required: true
        type: string

env:
  PLUGIN_NAME: Sam-Plugin

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Release Tag
        id: tag_env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ inputs.version_tag }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Dotnet Publish Project
        run: |
          CSPROJ=$(find . -name "${{ env.PLUGIN_NAME }}.csproj" -print -quit)
          dotnet publish "$CSPROJ" -c Release -o ./publish

      - name: Zip Published Artifacts
        run: |
          cd ./publish
          zip -r "../${{ env.PLUGIN_NAME }}.zip" .
          cd ..

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ env.TAG_NAME }}" >/dev/null 2>&1; then
            gh release upload "${{ env.TAG_NAME }}" "${{ env.PLUGIN_NAME }}.zip" --clobber
          else
            gh release create "${{ env.TAG_NAME }}" "${{ env.PLUGIN_NAME }}.zip" \
              --title "Release ${{ env.TAG_NAME }}" \
              --notes "Automated release via ${{ github.event_name }} (Commit: ${{ github.sha }})"
          fi
